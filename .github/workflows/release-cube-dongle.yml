name: Publish existing Cube dual dongle build
on:
  workflow_dispatch:
  push:
    branches: [codex/xingzhi-cube-dongle]
    paths: [.github/cube-dongle-release-request]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify source run and download existing artifact
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/39571889475" > run.json
          jq -e '.conclusion == "success" and .head_sha == "b6406c5b5fdd73f7599bd3c35f1429dc370d173b" and .head_branch == "codex/xingzhi-cube-dongle"' run.json
          gh run download 39571889475 --name Cube-Dual-Dongle --dir firmware
          test -f firmware/merged-binary.bin
          test -f firmware/xingzhi_cube_dual_candidate.bin
          (cd firmware && sha256sum -c SHA256SUMS)
      - name: Package and publish prerelease without rebuilding
        run: |
          set -euo pipefail
          mkdir release
          (cd firmware && zip -qr ../release/Cube-Velvet-Pro-Dongle-2026.10.21.zip .)
          cp firmware/merged-binary.bin release/
          cp firmware/xingzhi_cube_dual_candidate.bin release/
          (cd release && sha256sum *.bin *.zip > SHA256SUMS)
          cat > notes.md <<'NOTES'
          星智 Cube 1.54 TFT Wi-Fi：USB + BLE 双模 dongle 预发布。

          保留小智、主题与 Codex 同步。包含 DYA 系统行为（Bootloader、Studio Unlock、System Reset）、USB Output 绑定、USB → BLE 1～5 → USB 循环、紧凑黄色提示条、复位原因编码及正 tick 调度修复。

          **已知问题：用户仍报告反复看门狗重启，尚未确认根因和稳定性。编译通过不等于实机稳定；不建议替换唯一可用键盘。**

          ZIP 是完整固件包。`merged-binary.bin` 为完整镜像；`xingzhi_cube_dual_candidate.bin` 仅为应用镜像，不能作为完整镜像从 0x0 刷入。请按包内分区说明刷写；不要默认全片擦除或清除绑定。键盘左右手 UF2 不包含在本发布内。

          本发布复用成功构建 https://github.com/S7venYoung/ESP32-S3-Cube-Scanner/actions/runs/39571889475 ，源码固定为 b6406c5b5fdd73f7599bd3c35f1429dc370d173b，未再次编译。
          NOTES
          gh release create cube-dongle-2026.10.21 release/* \
            --target b6406c5b5fdd73f7599bd3c35f1429dc370d173b \
            --title "Cube Velvet Pro USB + BLE Dongle · 2026.10.21" \
            --prerelease --notes-file notes.md
