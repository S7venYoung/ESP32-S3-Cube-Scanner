name: Build Cube USB and BLE dongle candidate
on:
  push:
    branches: [codex/xingzhi-cube-dongle]
    paths:
      - 'main/**'
      - 'experimental/cube_dongle/**'
      - 'scripts/**'
      - 'docs/cube-dual-candidate.md'
      - '.github/workflows/build-cube-dual-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Apply inherited integration formatting
        run: |
          python3 -m venv /tmp/cube-format-env
          /tmp/cube-format-env/bin/pip install clang-format==21.1.8
          /tmp/cube-format-env/bin/clang-format -i main/scanner/*.cc main/scanner/*.h
          /tmp/cube-format-env/bin/clang-format -i main/boards/nologo/xingzhi-cube-1.54tft-wifi/xingzhi-cube-1.54tft-wifi.cc main/boards/nologo/xingzhi-cube-1.54tft-wifi/power_manager.h
      - name: Build split central and computer HID peripheral together
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: .
          command: bash scripts/build-cube-dual-candidate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Cube-Dual-Dongle
          path: |
            build/merged-binary.bin
            build/xingzhi_cube_dual_candidate.bin
            build/xiaozhi.bin
            build/generated_assets.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flash_args
            build/flasher_args.json
            build/sdkconfig
            build/SHA256SUMS
            build/DUAL-CANDIDATE-NOT-FINAL.md
            build/AUTO-BINDING.md
            build/DYA-STUDIO.md
          if-no-files-found: error
