name: Build ESP32-S3 scanner firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and merge ESP-IDF images
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.2
          target: esp32s3
          path: .
          command: idf.py build && cd build && python -m esptool --chip esp32s3 merge_bin -o merged-binary.bin --flash_mode qio --flash_freq 80m --flash_size 16MB 0x0 bootloader/bootloader.bin 0x8000 partition_table/partition-table.bin 0x10000 esp32_s3_cube_scanner.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-Cube-Scanner-firmware
          path: |
            build/merged-binary.bin
            build/esp32_s3_cube_scanner.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
          if-no-files-found: error
          retention-days: 30

